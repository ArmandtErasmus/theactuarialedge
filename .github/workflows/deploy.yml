name: Check and deploy

# Every push to main is checked and, if green, published to GitHub Pages.
# Pull requests run the same checks without deploying.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Content checks (questions, TeX, Python and SQL reference solutions)
        run: |
          node scripts/check-content.ts
          node scripts/check-sql.ts
          python scripts/check-python.py

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Custom domain (CNAME) serves from "/". For https://<user>.github.io/<repo>/ set BASE_PATH=/<repo>/.
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - name: End-to-end smoke test of the built site
        run: |
          node scripts/serve-pages.ts 4173 &
          sleep 2
          node scripts/e2e.ts http://localhost:4173 --only crawl
          node scripts/e2e.ts http://localhost:4173 --only flows

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
